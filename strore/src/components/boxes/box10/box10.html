<div
  class="selectable-box"
  [class.active]="isActive()"
  (click)="onClick()"
  (keydown)="onClick()"
>
  @if (imageSrc(); as src) {
    <img class="box-image" [src]="src" alt="pic" />
  } @else {
    <div class="box-text">
      <p>Select Element</p>
    </div>
  }

  <div>{{ optionValue() }}</div>
</div>
